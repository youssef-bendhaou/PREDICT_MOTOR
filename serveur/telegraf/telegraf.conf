[agent]
  interval = "1s"
  flush_interval = "1s"

# Ecoute les messages des machines : predictmotor/<machine>/mesures
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["predictmotor/+/mesures"]
  data_format = "json"
  name_override = "mesures"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "predictmotor/+/mesures"
    tags = "_/machine/_"

# Range tout dans InfluxDB
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "predictmotor"
  bucket = "mesures"
