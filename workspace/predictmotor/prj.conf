CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_W1=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Base de temps fine : echantillonnage a 400 Hz (2,5 ms) et 2 kHz (0,5 ms)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Console de commande : "moteur on" / "moteur off"
CONFIG_SHELL=y
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_PROMPT_UART=""
CONFIG_SHELL_VT100_COMMANDS=n
# Reseau Wi-Fi (station + DHCP)
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
